name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        include:
          # 3.15 final lands Oct 2026 — test the pre-release, but don't block merges on it.
          - python-version: "3.15-dev"
    continue-on-error: ${{ matrix.python-version == '3.15-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      - name: Install
        run: pip install -e ".[gemini,openai,anthropic,rag,rerank,parse]" pytest ruff
      - name: Lint
        run: ruff check src tests
      - name: Tests (offline — SDKs are faked)
        run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist + wheel
        run: pipx run build
      - name: Check metadata
        run: pipx run twine check dist/*
