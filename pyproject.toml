[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tai-aitutor"
dynamic = ["version"]
description = "Plain-Python RAG building blocks — LLMs, embeddings, chunking, retrieval and evaluation — as a migration path off LlamaIndex."
readme = "README.md"
# 3.12 floor: Colab's runtime (2026.04) is Python 3.12.13, and everything the package
# uses (incl. PEP 695 generics) landed in 3.12. Raising this breaks the install cell
# of every Colab notebook — don't, without checking Colab's runtime first.
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Towards AI" }]
keywords = ["rag", "llm", "embeddings", "retrieval", "evaluation", "llamaindex", "chroma"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "tiktoken>=0.7",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

# NOTE: extras are FLAT lists on purpose. Self-referential extras like
# "tai-aitutor[gemini,...]" resolve against PyPI, so they break git/local installs
# whenever the published index lags the code. Never reintroduce them.
# cohere and sentence-transformers are LESSON-SPECIFIC heavies: nothing imports them
# unless embed_cohere/rerank or embed_local is actually called, so notebooks may also
# just `pip install cohere` / `pip install sentence-transformers` directly.
[project.optional-dependencies]
gemini = ["google-genai>=1.35"]
openai = ["openai>=2,<3"]
# >=0.77 is the floor for client.messages.parse(..., output_format=Schema)
# -> response.parsed_output, which extract() uses. Verified by installing 0.76.0
# (absent) and 0.77.0 (present) and introspecting the signature, 2026-08-13.
anthropic = ["anthropic>=0.77"]
providers = ["google-genai>=1.35", "openai>=2,<3", "anthropic>=0.77"]
rag = ["chromadb>=1.0.21"]
rerank = ["cohere>=5.13"]
local = ["sentence-transformers>=3.0"]
web = ["tavily-python>=0.5"]
all = [
    "google-genai>=1.35",
    "openai>=2,<3",
    "anthropic>=0.77",
    "chromadb>=1.0.21",
    "cohere>=5.13",
    "sentence-transformers>=3.0",
    "tavily-python>=0.5",
]

[project.urls]
Homepage = "https://github.com/jaiganesan-n/tai-aitutor"
Repository = "https://github.com/jaiganesan-n/tai-aitutor"

[tool.hatch.version]
path = "src/tai_aitutor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tai_aitutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
